# Урезанная копия macOS /etc/pf.conf для стенда.
# Строку с якорем splitr в бою дописывает `splitr install`.
scrub-anchor "com.apple/*"
nat-anchor "com.apple/*"
rdr-anchor "com.apple/*"
dummynet-anchor "com.apple/*"
anchor "com.apple/*"
anchor "splitr"
load anchor "splitr" from "/etc/pf.anchors/splitr"
