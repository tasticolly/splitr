name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "not gofmt'd:"; echo "$unformatted"; exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: build
        run: go build ./...

      # Unit tests only. They need no root, no network and touch nothing
      # outside the work tree; the pf and docker suites cannot run here.
      - name: test
        run: go test ./...

  menubar:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: build the menu bar app
        run: ./menubar/build.sh
